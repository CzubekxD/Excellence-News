name: Zgłoszenie błędu
description: Zgłoś błąd, który da się odtworzyć.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Podatności zgłaszaj [prywatnie](https://github.com/CzubekxD/Excellence-News/security/advisories/new).
        Nie wklejaj całego .env, kluczy API, hasła administratora, ciasteczek ani bazy produkcyjnej.
  - type: input
    id: revision
    attributes:
      label: Wersja kodu
      description: Wynik git rev-parse --short HEAD w katalogu repozytorium; jeśli nie wiesz, podaj datę pobrania lub aktualizacji.
      placeholder: commit albo data pobrania
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Środowisko
      description: System, Docker czy uruchomienie bez Dockera, wersje; przy problemach ze stroną także przeglądarka.
      placeholder: Debian w VM na Proxmoxie; Docker Compose; reverse proxy tak/nie; zmienione ustawienia.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Kroki odtworzenia
      description: Od jakiej strony, polecenia lub działania zacząć? Najkrótsze kroki, które pokazują problem.
      placeholder: |
        1. Otwórz…
        2. Wykonaj…
        3. Pojawia się…
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Oczekiwany i faktyczny wynik
      placeholder: Oczekiwano…; faktycznie…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logi lub zrzuty ekranu (opcjonalnie)
      description: Tylko istotne fragmenty, bez kluczy, haseł, ciasteczek i danych osobowych; zgłoszenie bez logów też jest w porządku.
