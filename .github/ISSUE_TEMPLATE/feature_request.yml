name: Propozycja zmiany
description: Zaproponuj funkcję albo ulepszenie z konkretnym zastosowaniem.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Nowe źródło możesz najpierw dodać sam w panelu (Źródła → Nowe źródło); opis: docs/pl/zrodla.md.
        Funkcje potrzebne tylko temu serwisowi buduje się jako moduł w `modules/`.
  - type: textarea
    id: problem
    attributes:
      label: Zastosowanie i problem
      description: Kto i w jakiej sytuacji tego potrzebuje? Co dziś przeszkadza?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proponowana zmiana
      description: Opisz oczekiwane zachowanie albo wynik, najlepiej z przykładem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Wypróbowane rozwiązania (opcjonalnie)
      description: Dlaczego obecna konfiguracja, skrypty albo inne rozwiązania nie wystarczają?
